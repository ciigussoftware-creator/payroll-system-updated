# Local dev Postgres (see README.md for the docker run command):
#   docker run --name payroll-postgres -e POSTGRES_USER=payroll \
#     -e POSTGRES_PASSWORD=payroll -e POSTGRES_DB=payroll \
#     -p 5432:5432 -d postgres:16

spring:
  application:
    name: payroll-web-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/payroll
    # Dev-only defaults pointing at a local Postgres. Override via DB_USERNAME /
    # DB_PASSWORD env vars for anything beyond local dev.
    username: ${DB_USERNAME:payroll}
    password: ${DB_PASSWORD:payroll}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  # No default on purpose: a fallback secret baked into source control would let
  # anyone who has read the repo forge valid tokens. Spring fails fast at startup
  # if JWT_SECRET isn't set, rather than silently signing tokens with a known key.
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

security:
  login-rate-limit:
    max-attempts: 5
    window-ms: 900000 # 15 minutes
