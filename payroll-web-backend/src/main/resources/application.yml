# Local dev Postgres (see README.md for the docker run command):
#   docker run --name payroll-postgres -e POSTGRES_USER=payroll \
#     -e POSTGRES_PASSWORD=payroll -e POSTGRES_DB=payroll \
#     -p 5432:5432 -d postgres:16

spring:
  application:
    name: payroll-web-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/payroll
    username: payroll
    password: payroll
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  # Dev-only default secret (Base64, 256-bit). Override via the JWT_SECRET
  # env var in any real deployment — never ship this default to production.
  secret: ${JWT_SECRET:/cYWUqXGnhh2cgH1TwkgOBUYMjuEU7aVYvnIhO0MdB8=}
  expiration-ms: 3600000
